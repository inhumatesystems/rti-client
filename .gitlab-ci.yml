stages:
  - generate
  - build
  - test
  - build-2
  - package
  - publish
  - release

variables:
  BROKER_PROJECT_ID: 46515078
  BROKER_BRANCH: main

default:
  before_script:
    - VERSION=${CI_COMMIT_TAG}
    - "[ -z \"$VERSION\" ] && VERSION=0.0.${CI_PIPELINE_IID}"
    - export VERSION
    - export DEBIAN_FRONTEND=noninteractive


# GENERATE

# All protobuf code and constants for every client, from the RTI contract via inhumate-contract.yml.
generate:
  stage: generate
  image: node:22
  script:
    - npx --yes inhumate-contract
  artifacts:
    paths:
      - js/src/generated
      - python/inhumate_rti/generated
      - dotnet/src/generated
      - cpp/generated
      # The protobuf C++ source the cpp jobs build their runtime from, at the version the cpp job
      # pins its protoc to. Fetched here so exactly one job decides that version.
      - cpp/protobuf
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules


# BUILD

# ESLint for the js client and vue integration. Needs no generated code (src/generated is ignored and
# the rules are not type-aware), so it runs straight away.
lint js and vue:
  stage: build
  needs: []
  image: node:22-slim
  script:
    - npm install
    - npm run lint -w js -w vue
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules

build js client:
  stage: build
  needs:
    - generate
  image: node:22-slim
  script:
    - cd js
    - sed -i "s/0.0.1-dev-version/${VERSION}/g" package.json src/rticlient.ts webpack.config.cjs
    - npm install
    - npm run build
    - npm pack
  artifacts:
    paths:
      - js/src/rticlient.ts
      - js/src/generated
      - js/package.json
      - js/lib
      - js/dist
      - js/inhumate*.tgz
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules
      - js/node_modules

build vue client:
  stage: build
  needs:
    - build js client
  image: node:22-slim
  script:
    - cd vue
    - sed -i "s/0.0.1-dev-version/${VERSION}/g" package.json
    - npm install
    - npm run build
    - npm pack
  artifacts:
    paths:
      - vue/dist
      - vue/package.json
      - vue/inhumate*.tgz
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules
      - vue/node_modules

build python client:
  stage: build
  needs:
    - generate
  image: python:3.10-slim
  script:
    - cd python
    - sed -i "s/0.0.1-dev-version/${VERSION}/g" setup.py inhumate_rti/__init__.py
    - pip install build
    - python -m build
  artifacts:
    paths:
      - python/setup.py
      - python/inhumate_rti/__init__.py
      - python/inhumate_rti/generated
      - python/dist
    expire_in: 1 week

build dotnet client:
  stage: build
  needs:
    - generate
  image: mcr.microsoft.com/dotnet/sdk:8.0
  script:
    - cd dotnet/src
    - sed -i "s/0.0.1-dev-version/${VERSION}/g" *.csproj RTIClient.cs
    - dotnet build -c Release
    - dotnet publish -c Release
  artifacts:
    paths:
      - dotnet/src/RTIClient.cs
      - dotnet/src/generated
      - dotnet/src/bin/Release/net*/publish
      - dotnet/src/bin/Release/*.nupkg
    expire_in: 1 week

build c++ static client linux:
  stage: build
  needs:
    - generate
  image: ubuntu:24.04
  script:
    - apt-get update -qq && apt-get install -qq git gcc g++ make cmake libasio-dev libssl-dev libwebsocketpp-dev
    - sed -i "s/0.0.1-dev-version/${VERSION}/g" cpp/inhumaterti.hpp
    - cpp/scripts/linux_static_build.sh
  artifacts:
    paths:
      - cpp/inhumaterti.hpp
      - cpp/generated
      - cpp/build
      - cpp/protobuf/src
      - cpp/protobuf-build
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      # protobuf 3.11.2 never changes, and it now builds outside the source tree the generate job
      # ships, so caching it no longer fights the artifact extraction.
      - cpp/protobuf-build
      - cpp/asio
      - cpp/websocketpp
  
build c++ static client windows:
  stage: build
  needs:
    - generate
  tags:
    - win64
  before_script:
    - if ( "${CI_COMMIT_TAG}" ) { $VERSION = "${CI_COMMIT_TAG}" }
    - if ( ! "$VERSION" ) { $VERSION = "0.0.${CI_PIPELINE_IID}" }
  script:
    - ((get-content -path cpp\inhumaterti.hpp -raw) -replace "0.0.1-dev-version","$VERSION") | set-content -path cpp\inhumaterti.hpp
    - powershell -file cpp\scripts\windows_static_build.ps1
  artifacts:
    paths:
      - cpp/inhumaterti.hpp
      - cpp/generated
      - cpp/build
      - cpp/protobuf-build
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - cpp/protobuf-build
      - cpp/asio
      - cpp/websocketpp
    
build c++ ue5 client linux:
  stage: build-2
  needs:
    - generate
  tags:
    - linux
    - nm8
  only:
    - tags
    - /.*publish$/
    - /^(ue).*/
  script:
    - sed -i "s/0.0.1-dev-version/${VERSION}/g" cpp/inhumaterti.hpp
    - cpp/scripts/linux_ue5_build.sh
  artifacts:
    paths:
      - cpp/build-ue5/Include
      - cpp/build-ue5/Linux
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      # protobuf 3.11.2 is pinned and never changes, and it builds outside the source tree the
      # generate job ships - so cache the *build* directory, not cpp/protobuf, which arrives as a
      # fresh artifact every pipeline. The build script skips the protobuf build when it is there.
      - cpp/protobuf-ue5-build
      - cpp/asio
      - cpp/websocketpp

build c++ ue5 client windows:
  stage: build-2
  needs:
    - generate
  tags:
    - win64
    - nm8
  only:
    - tags
    - /.*publish$/
    - /^(ue).*/
  before_script:
    - if ( "${CI_COMMIT_TAG}" ) { $VERSION = "${CI_COMMIT_TAG}" }
    - if ( ! "$VERSION" ) { $VERSION = "0.0.${CI_PIPELINE_IID}" }
  script:
    - ((get-content -path cpp\inhumaterti.hpp -raw) -replace "0.0.1-dev-version","$VERSION") | set-content -path cpp\inhumaterti.hpp
    - powershell -file cpp\scripts\windows_ue5_build.ps1
  artifacts:
    paths:
      - cpp/build-ue5/Include
      - cpp/build-ue5/Win64
    expire_in: 1 week
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - cpp/protobuf-ue5-build
      - cpp/asio
      - cpp/websocketpp
        

# TEST

test js client:
  stage: test
  image: node:22-slim
  needs:
    - build js client
  script:
    - apt-get update -qq && apt-get install -qq curl unzip
    - "curl --location --output artifacts.zip --header \"PRIVATE-TOKEN: ${PRIVATE_TOKEN}\" \"https://gitlab.com/api/v4/projects/${BROKER_PROJECT_ID}/jobs/artifacts/${BROKER_BRANCH}/download?job=build%20broker\" && unzip artifacts.zip && rm -f artifacts.zip"
    - node broker/dist/broker.js &
    - sleep 10
    - cd js
    - npm install
    - npm run test-ci
  artifacts:
    reports:
      junit:
        - js/junit.xml
  cache:
    key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - js/node_modules

test python client:
  stage: test
  image: python:3.10-slim
  needs:
    - build python client
  script:
    - apt-get update -qq && apt-get install -qq curl unzip python3-pip
    # Install node and broker
    - curl -sL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - "curl --location --output artifacts.zip --header \"PRIVATE-TOKEN: ${PRIVATE_TOKEN}\" \"https://gitlab.com/api/v4/projects/${BROKER_PROJECT_ID}/jobs/artifacts/${BROKER_BRANCH}/download?job=build%20broker\" && unzip artifacts.zip && rm -f artifacts.zip"
    # Start broker
    - node broker/dist/broker.js &
    - sleep 10
    # Run tests
    - pip install -r python/inhumate_rti/requirements.txt
    - pip install -r python/test/requirements.txt
    - cd python/test
    - python -mpytest -v --junitxml=./test-result.xml
  artifacts:
    reports:
      junit:
        - python/test/test-result.xml

test dotnet client:
  stage: test
  allow_failure: true
  image: mcr.microsoft.com/dotnet/sdk:8.0
  needs:
    - build dotnet client
  script:
    - apt-get update -qq && apt-get install -qq curl unzip
    # Install node and broker
    - curl -sL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - "curl --location --output artifacts.zip --header \"PRIVATE-TOKEN: ${PRIVATE_TOKEN}\" \"https://gitlab.com/api/v4/projects/${BROKER_PROJECT_ID}/jobs/artifacts/${BROKER_BRANCH}/download?job=build%20broker\" && unzip artifacts.zip && rm -f artifacts.zip"
    # Start broker
    - node broker/dist/broker.js &
    - sleep 10
    # Run tests
    - cd dotnet/test
    - dotnet test -v n --test-adapter-path:. --logger:"junit;LogFilePath=./test-result.xml;MethodFormat=Class;FailureBodyFormat=Verbose"
  artifacts:
    reports:
      junit:
        - dotnet/test/test-result.xml

test c++ client:
  stage: test
  image: ubuntu:24.04
  needs:
    - build c++ static client linux
  script:
    - apt-get -qq update && apt-get install -qq curl unzip libssl3
    # Install node and broker
    - curl -sL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - "curl --location --output artifacts.zip --header \"PRIVATE-TOKEN: ${PRIVATE_TOKEN}\" \"https://gitlab.com/api/v4/projects/${BROKER_PROJECT_ID}/jobs/artifacts/${BROKER_BRANCH}/download?job=build%20broker\" && unzip artifacts.zip && rm -f artifacts.zip"
    # Start broker
    - node broker/dist/broker.js &
    - sleep 10
    # Run tests
    - cd cpp/build
    - ./inhumaterti_test --reporter junit >test-result.xml || ./inhumaterti_test --reporter junit >test-result.xml
  artifacts:
    reports:
      junit:
        - cpp/build/test-result.xml


# PACKAGE

package c++ static client:
  stage: package
  image: node:22-slim
  needs:
    - build c++ static client linux
    - build c++ static client windows
  script:
    - apt-get update -qq && apt-get install -qq zip
    - cpp/scripts/package_static.sh
  artifacts:
    paths:
      - cpp/build/inhumate*.zip
    expire_in: 1 week

package c++ ue5 client:
  stage: package
  image: node:22-slim
  needs:
    - build c++ ue5 client windows
    - build c++ ue5 client linux
    # - build c++ ue4 client macos
  script:
    - apt-get update -qq && apt-get install -qq zip
    - cpp/scripts/package_ue5.sh
  artifacts:
    paths:
      - cpp/build-ue5/inhumate*.zip
  only:
    - tags
    - /.*publish$/
    - /^ue.*/


# PUBLISH
# Using trusted publishing - https://docs.npmjs.com/trusted-publishers

publish npm:
  stage: publish
  image: node:22-slim
  only:
    - tags
    - /.*publish$/
  needs:
    - build js client
    - build vue client
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    # Trusted publishing needs npm >= 11.5.1; node:22-slim ships 10.x
    - npm install -g npm@^11.5.1
    - cd js
    - npm publish
    - cd ../vue
    - npm publish

publish pypi:
  stage: publish
  image: python:3.10-slim
  only:
    - tags
    - /.*publish$/
  variables:
    GIT_STRATEGY: none
  needs:
    - build python client
  script:
    - apt-get update -qq && apt-get install -qq curl python3-pip
    - pip3 install twine
    - echo -e "[pypi]\n  username = __token__\n  password = ${PYPI_TOKEN}\n" > $HOME/.pypirc
    - cd python
    - python3 -m twine check dist/*
    - python3 -m twine upload dist/*

publish nuget:
  stage: publish
  image: mcr.microsoft.com/dotnet/sdk:8.0
  only:
    - tags
    - /.*publish$/
    - /.*nuget$/
  variables:
    GIT_STRATEGY: none
  needs:
    - build dotnet client
  id_tokens:
    NUGET_ID_TOKEN:
      aud: "https://www.nuget.org"
  variables:
    NUGET_TOKEN_ENDPOINT: "https://www.nuget.org/api/v2/token"
    NUGET_SOURCE: "https://www.nuget.org/api/v2/package"
    NUGET_USERNAME: minhumate
  script:
    # Exchange OIDC token for NuGet API key .
    - |
      apt-get update && apt-get install -y jq
      RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "$NUGET_TOKEN_ENDPOINT" \
        -H "Content-Type: application/json" \
        -H "Authorization: Bearer $NUGET_ID_TOKEN" \
        -d "{\"username\": \"$NUGET_USERNAME\", \"tokenType\": \"ApiKey\"}")
      API_KEY=$(echo "$RESPONSE" | head -n -1 | jq -r '.apiKey')

    # Push package
    - cd dotnet/src
    - dotnet nuget push bin/Release/*.nupkg -s "$NUGET_SOURCE" -k "$API_KEY"

publish generic:
  stage: publish
  needs:
    - build js client
    - build vue client
    - build python client
    - build dotnet client
    - package c++ static client
    - package c++ ue5 client
  image: curlimages/curl:latest
  only:
    - tags
    - /.*publish$/
  script:
    - |
      packages_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/rti/${VERSION}"
      for file in */inhumate*.tgz js/dist/inhumate*.js python/dist/inhumate_*.whl dotnet/src/bin/Release/Inhumate*.nupkg cpp/build/inhumate*.zip cpp/build-ue5/inhumate*.zip ; do
        filename=$(basename "$file")
        curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" "$packages_url/$filename"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  only:
    - tags
  script:
    # NOTE: This fails if you first manually created a release in the Gitlab web app (sigh)
    # see https://gitlab.com/gitlab-org/release-cli/-/issues/94
    # On another NOTE: the links end up in the reverse order on the releases page.
    - |
      packages_url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/rti/${VERSION}"
      release-cli create --name "Version $VERSION" --tag-name $VERSION \
        --assets-link "{\"name\":\"inhumate-rti-ue5-cpp-client-${VERSION}.zip\",\"url\":\"${packages_url}/inhumate-rti-ue5-cpp-client-${VERSION}.zip\"}" \
        --assets-link "{\"name\":\"inhumate-rti-cpp-client-${VERSION}.zip\",\"url\":\"${packages_url}/inhumate-rti-cpp-client-${VERSION}.zip\"}" \
        --assets-link "{\"name\":\"Inhumate.RTI.${VERSION}.nupkg\",\"url\":\"${packages_url}/Inhumate.RTI.${VERSION}.nupkg\"}" \
        --assets-link "{\"name\":\"inhumate_rti-${VERSION}-py3-none-any.whl\",\"url\":\"${packages_url}/inhumate_rti-${VERSION}-py3-none-any.whl\"}" \
        --assets-link "{\"name\":\"inhumate-rti-vue-${VERSION}.tgz\",\"url\":\"${packages_url}/inhumate-rti-vue-${VERSION}.tgz\"}" \
        --assets-link "{\"name\":\"inhumate-rti-${VERSION}.tgz\",\"url\":\"${packages_url}/inhumate-rti-${VERSION}.tgz\"}" \
        --assets-link "{\"name\":\"inhumate-rti-bundle-${VERSION}.js\",\"url\":\"${packages_url}/inhumate-rti-bundle-${VERSION}.js\"}" \
        ;
